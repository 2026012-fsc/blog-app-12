<!DOCTYPE html>
<html lang="ja" xmlns="http:/www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title}">blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header th:replace="~{fragments/layout}"></header>
    <div class="home">
        <nav class="menu">
            <a href="/blog">home</a>
            <a href="">about</a>
        </nav>
        <div class="detail">
            <h1 th:text="${blog.title}">title</h1>
            <h3 th:text="${blog.summary}">summary</h3>
            <p th:text="${blog.maintext}">maintext</p>
        <form th:action="@{/blog/{id}/delete(id=${blog.id})}" method="post">
            <button type="submit" class="delete">削除</button>
        </form>
        </div>
    </div>
</body>

</html>
